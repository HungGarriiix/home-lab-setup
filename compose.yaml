# ~/secrets/compose/dockge.yaml
services:
    dockge:
        image: louislam/dockge:1
        container_name: dockge
        restart: unless-stopped
        ports:
            - "${DOCKGE_PORT:?set DOCKGE_PORT in .env}:5001"
        volumes:
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
            - type: volume
              source: dockge
              target: /app/data
              volume:
                  subpath: dockge-data
            - type: volume
              source: dockge
              target: ${VOLUMES_DIR}/dockge
        environment:
            - DOCKGE_STACKS_DIR=${VOLUMES_DIR}/dockge
        depends_on:
            - portainer
        labels:
            - homepage.group=Management
            - homepage.name=Dockge
            - homepage.icon=dockge.png
            - homepage.href=${DOCKGE_URL}
            - homepage.description=Docker Compose stack manager
    # ~/secrets/compose/portainer.yaml
    portainer:
        image: portainer/portainer-ce:lts
        container_name: portainer
        restart: unless-stopped
        ports:
            - "${PORTAINER_PORT:?set PORTAINER_PORT in .env}:9443"
        volumes:
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
            - type: volume
              source: portainer_data
              target: /data
        labels:
            - homepage.group=Management
            - homepage.name=Portainer
            - homepage.icon=portainer.png
            - homepage.href=${PORTAINER_URL}
            - homepage.description=Docker container management
    # Renders homer/config.yml from config.yml.tmpl using .env values, then exits
    homer-config:
        image: alpine:3
        restart: "no"
        command:
            - sh
            - -c
            - >-
                apk add --no-cache -q gettext &&
                envsubst '$$PORTAINER_URL $$DOCKGE_URL' < /assets/config.yml.tmpl > /assets/config.yml &&
                chown $$(stat -c %u:%g /assets/config.yml.tmpl) /assets/config.yml
        environment:
            - PORTAINER_URL=${PORTAINER_URL:?set PORTAINER_URL in .env}
            - DOCKGE_URL=${DOCKGE_URL:?set DOCKGE_URL in .env}
        volumes:
            - type: volume
              source: homer
              target: /assets
    homer:
        image: b4bz/homer:latest
        container_name: homer
        restart: unless-stopped
        ports:
            - "${HOMER_PORT:?set HOMER_PORT in .env}:8080"
        volumes:
            - type: volume
              source: homer
              target: /www/assets
        environment:
            # Assets are tracked in git; don't let Homer copy its defaults over them
            - INIT_ASSETS=0
        depends_on:
            homer-config:
                condition: service_completed_successfully
        labels:
            - homepage.group=Dashboards
            - homepage.name=Homer
            - homepage.icon=homer.png
            - homepage.href=${HOMER_URL}
            - homepage.description=Static service dashboard
    homepage:
        image: ghcr.io/gethomepage/homepage:latest
        container_name: homepage
        restart: unless-stopped
        ports:
            - "${HOMEPAGE_PORT:?set HOMEPAGE_PORT in .env}:3000"
        volumes:
            - type: volume
              source: homepage
              target: /app/config
              volume:
                  subpath: config
            # Read-only socket for Homepage's Docker integration
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
        environment:
            - HOMEPAGE_ALLOWED_HOSTS=localhost:${HOMEPAGE_PORT},127.0.0.1:${HOMEPAGE_PORT}
            - PUID=1000
            # Run with the socket's group so Homepage can read it for label discovery
            - PGID=${DOCKER_GID:?set DOCKER_GID in .env}
        labels:
            - homepage.group=Dashboards
            - homepage.name=Homepage
            - homepage.icon=homepage.png
            - homepage.href=${HOMEPAGE_URL}
            - homepage.description=Dashboard with Docker service discovery

volumes:
    portainer_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/portainer_data
    dockge:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/dockge
    homer:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/homer
    homepage:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/homepage
