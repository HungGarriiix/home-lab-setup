services:
    # Reverse proxy: routes <name>.${LAB_HOSTNAME} to containers that opt in with traefik.* labels
    traefik:
        image: traefik:v3
        container_name: traefik
        restart: unless-stopped
        ports:
            - "${TRAEFIK_HTTP_PORT:?set TRAEFIK_HTTP_PORT in .env}:80"
            # Insecure dashboard/API (--api.insecure); host port must not clash with HOMER_PORT
            - "${TRAEFIK_DASHBOARD_PORT:?set TRAEFIK_DASHBOARD_PORT in .env}:8080"
        # Static config lives in ${VOLUMES_DIR}/traefik/traefik.yml (no command: flags; Traefik reads only one static source)
        configs:
            - source: traefik_static
              target: /etc/traefik/traefik.yml
        volumes:
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
            # File-provider dynamic config (watched, no restart needed)
            - type: volume
              source: traefik
              target: /etc/traefik/dynamic
              volume:
                  subpath: dynamic
        networks:
            - proxy
        labels:
            # Dashboard through Traefik itself
            - traefik.enable=true
            - traefik.http.routers.traefik.rule=Host(`traefik.${LAB_HOSTNAME:?set LAB_HOSTNAME in .env}`)
            - traefik.http.routers.traefik.entrypoints=web
            - traefik.http.routers.traefik.service=api@internal
            - homepage.group=Management
            - homepage.name=Traefik
            - homepage.icon=traefik.png
            - homepage.href=${TRAEFIK_URL}
            - homepage.description=Reverse proxy
    # ~/secrets/compose/dockge.yaml
    dockge:
        image: louislam/dockge:1
        container_name: dockge
        restart: unless-stopped
        ports:
            - "${DOCKGE_PORT:?set DOCKGE_PORT in .env}:5001"
        volumes:
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
            - type: volume
              source: dockge
              target: /app/data
              volume:
                  subpath: dockge-data
            - type: volume
              source: dockge
              target: ${VOLUMES_DIR}/dockge
        environment:
            - DOCKGE_STACKS_DIR=${VOLUMES_DIR}/dockge
        depends_on:
            - portainer
        networks:
            - proxy
        labels:
            - traefik.enable=true
            - traefik.http.routers.dockge.rule=Host(`dockge.${LAB_HOSTNAME}`)
            - traefik.http.routers.dockge.entrypoints=web
            - traefik.http.services.dockge.loadbalancer.server.port=5001
            - homepage.group=Management
            - homepage.name=Dockge
            - homepage.icon=dockge.png
            - homepage.href=${DOCKGE_URL}
            - homepage.description=Docker Compose stack manager
    # ~/secrets/compose/portainer.yaml
    portainer:
        image: portainer/portainer-ce:lts
        container_name: portainer
        restart: unless-stopped
        ports:
            - "${PORTAINER_PORT:?set PORTAINER_PORT in .env}:9443"
        volumes:
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
            - type: volume
              source: portainer_data
              target: /data
        networks:
            - proxy
        labels:
            - traefik.enable=true
            - traefik.http.routers.portainer.rule=Host(`portainer.${LAB_HOSTNAME}`)
            - traefik.http.routers.portainer.entrypoints=web
            - traefik.http.services.portainer.loadbalancer.server.port=9000
            - homepage.group=Management
            - homepage.name=Portainer
            - homepage.icon=portainer.png
            - homepage.href=${PORTAINER_URL}
            - homepage.description=Docker container management
    # Renders homer/config.yml from config.yml.tmpl using .env values, then exits
    homer-config:
        image: alpine:3
        restart: "no"
        command:
            - sh
            - -c
            - >-
                apk add --no-cache -q gettext &&
                envsubst '$$PORTAINER_URL $$DOCKGE_URL' < /assets/config.yml.tmpl > /assets/config.yml &&
                chown $$(stat -c %u:%g /assets/config.yml.tmpl) /assets/config.yml
        environment:
            - PORTAINER_URL=${PORTAINER_URL:?set PORTAINER_URL in .env}
            - DOCKGE_URL=${DOCKGE_URL:?set DOCKGE_URL in .env}
        volumes:
            - type: volume
              source: homer
              target: /assets
    homer:
        image: b4bz/homer:latest
        container_name: homer
        restart: unless-stopped
        ports:
            - "${HOMER_PORT:?set HOMER_PORT in .env}:8080"
        volumes:
            - type: volume
              source: homer
              target: /www/assets
        environment:
            # Assets are tracked in git; don't let Homer copy its defaults over them
            - INIT_ASSETS=0
        depends_on:
            homer-config:
                condition: service_completed_successfully
        networks:
            - proxy
        labels:
            - traefik.enable=true
            - traefik.http.routers.homer.rule=Host(`homer.${LAB_HOSTNAME}`)
            - traefik.http.routers.homer.entrypoints=web
            - traefik.http.services.homer.loadbalancer.server.port=8080
            - homepage.group=Dashboards
            - homepage.name=Homer
            - homepage.icon=homer.png
            - homepage.href=${HOMER_URL}
            - homepage.description=Static service dashboard
    homepage:
        image: ghcr.io/gethomepage/homepage:latest
        container_name: homepage
        restart: unless-stopped
        ports:
            - "${HOMEPAGE_PORT:?set HOMEPAGE_PORT in .env}:3000"
        volumes:
            - type: volume
              source: homepage
              target: /app/config
              volume:
                  subpath: config
            # Read-only socket for Homepage's Docker integration
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
        environment:
            - HOMEPAGE_ALLOWED_HOSTS=localhost:${HOMEPAGE_PORT},127.0.0.1:${HOMEPAGE_PORT},homepage.${LAB_HOSTNAME}
            - PUID=1000
            # Run with the socket's group so Homepage can read it for label discovery
            - PGID=${DOCKER_GID:?set DOCKER_GID in .env}
        networks:
            - proxy
        labels:
            - traefik.enable=true
            - traefik.http.routers.homepage.rule=Host(`homepage.${LAB_HOSTNAME}`)
            - traefik.http.routers.homepage.entrypoints=web
            - traefik.http.services.homepage.loadbalancer.server.port=3000
            - homepage.group=Dashboards
            - homepage.name=Homepage
            - homepage.icon=homepage.png
            - homepage.href=${HOMEPAGE_URL}
            - homepage.description=Dashboard with Docker service discovery

volumes:
    portainer_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/portainer_data
    dockge:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/dockge
    homer:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/homer
    homepage:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/homepage
    traefik:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${VOLUMES_DIR}/traefik

configs:
    traefik_static:
        file: ${VOLUMES_DIR}/traefik/traefik.yml

networks:
    # Shared with Traefik; fixed name so stacks outside this project (e.g. Dockge's) can join it as external
    proxy:
        name: proxy
        driver: bridge
